name: Validar calculadora

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "5.00"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar sintaxis
        run: python -m py_compile calculator.py app.py

      - name: Comprobar operaciones
        run: |
          python - <<'PY'
          from calculator import sumar, restar, multiplicar, dividir

          assert sumar(8, 2) == 10
          assert restar(8, 2) == 6
          assert multiplicar(8, 2) == 16
          assert dividir(8, 2) == 4

          try:
              dividir(8, 0)
          except ValueError:
              print("División entre cero controlada correctamente.")
          else:
              raise AssertionError("La división entre cero debe rechazarse.")

          print("Todas las operaciones funcionan correctamente.")
          PY